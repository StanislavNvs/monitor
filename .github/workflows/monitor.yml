name: Monitor Tickets

on:
  workflow_dispatch: # Оставляем только этот триггер. Теперь скрипт запускается внешним сигналом.

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Понадобится для сохранения логов/дедупликации в репозиторий
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Кэш Playwright (лучше завязать на фиксированный ключ v1, чтобы он не сбрасывался при изменении кода в monitor.py)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install chromium --with-deps

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATE_MONTH_TEXT: "ноября, пт"   # Исправлено на "пт", так как Nov 06 — это пятница
          DATE_CELL_NAME: "Fri Nov 06"
        run: python monitor.py
